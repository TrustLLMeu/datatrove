[project]
name = "trustllm-trove"
version = "0.0.1"
description = "Trustllm datatrove stuff"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10.0"
dependencies = [
    "datatrove",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
